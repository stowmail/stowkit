# Build, test and secret-scan every push to main and every pull request,
# as scripts/check.sh does locally (R-01, D-498). The "check" job is a
# required status check on main.
name: check

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Xcode 27.1 (27A9275), the same Swift 6.4 as the development Mac.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          swift --version

      # Only the downloaded zip is cached, keyed by its SHA-256. The unpacked
      # framework never is, so fetch-sqlcipher.sh checks the checksum and
      # Zetetic's signature on every run.
      - name: SQLCipher checksum
        id: sqlcipher
        run: echo "sha256=$(sed -n 's/^CHECKSUM="\(.*\)"$/\1/p' scripts/fetch-sqlcipher.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ee.getstow.dev
          key: sqlcipher-zip-${{ steps.sqlcipher.outputs.sha256 }}
      - name: Fetch SQLCipher (checksum and Zetetic signature)
        run: scripts/fetch-sqlcipher.sh

      # Dependency clones only, keyed by the pinned versions; never build products.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/repositories
          key: swiftpm-repositories-${{ hashFiles('Package.resolved') }}

      - name: Fixtures
        run: scripts/make-fixtures
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

      # A release binary checked against the SHA-256 in gitleaks' published
      # checksums file, not gitleaks-action (a paid licence for organisations).
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks (whole history)
        run: gitleaks git --redact --no-banner .
