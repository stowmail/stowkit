# A short libFuzzer pass over every parser on pushes to main and weekly
# (R-02, D-499). Not a required check. Longer runs are local:
# scripts/fuzz.sh <target> [seconds].
name: fuzz

on:
  push:
    branches: [main, "ci/**"]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      SWIFT_PKG_SHA256: 8fd03185b98fe27f54a54631c2449decf75d5b466ce8e34abbd414141063c6aa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      # Xcode's Swift cannot build fuzzers on macOS (D-085). The swift.org
      # package is cached by its SHA-256 and checked on every run: that hash,
      # then the Swift Open Source Developer ID signature.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/swift-pkg
          key: swift-6.4.0-pkg-${{ env.SWIFT_PKG_SHA256 }}
      - name: Install the swift.org 6.4.0 toolchain
        run: |
          PKG="$HOME/swift-pkg/swift-6.4.0-RELEASE-osx.pkg"
          mkdir -p "$HOME/swift-pkg"
          if [ ! -f "$PKG" ]; then
            curl -fsSL -o "$PKG" \
              https://download.swift.org/swift-6.4.0-release/xcode/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-osx.pkg
          fi
          echo "$SWIFT_PKG_SHA256  $PKG" | shasum -a 256 -c -
          pkgutil --check-signature "$PKG" | grep -q "Developer ID Installer: Swift Open Source (V9AUD2URP3)"
          installer -pkg "$PKG" -target CurrentUserHomeDirectory

      - name: Fixtures (seeds for the mime target)
        run: scripts/make-fixtures

      - name: Fuzz each target for three minutes
        run: |
          for target in mime html words query zip imap; do
            scripts/fuzz.sh "$target" 180
          done

      - name: Keep any finding
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: .build/fuzz/*/artifacts/
          if-no-files-found: ignore
