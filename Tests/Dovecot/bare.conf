# The same server with every optional extension hidden, so sync runs with
# nothing optional (brief step 3). SASL PLAIN stays on: Dovecot's LOGIN
# command uses it inside, and without it LOGIN fails with "Unsupported
# authentication mechanism" (D-575). The tests send LOGIN by ignoring
# AUTH=PLAIN in a debug build.
protocols = imap
listen = *
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

# One synthetic user; the password is a fixture, not a secret (users file).
passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/stow/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000
}

# Plain text on 143 is reached only through the debug loopback endpoint (D-471);
# 993 has the image's self-signed certificate, which Stow must refuse (D-570 item 4).
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

imap_capability = IMAP4rev1
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    auto = no
  }
  mailbox Trash {
    auto = no
  }
  mailbox Junk {
    auto = no
  }
}

log_path = /dev/stdout
