# Local test server for the generic IMAP track (D-555, D-570). Synthetic mail
# only; reached only on 127.0.0.1 through `scripts/dovecot-test.sh`.
protocols = imap
listen = *
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

# One synthetic user; the password is a fixture, not a secret (users file).
passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/stow/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000
}

# Plain text on 143 is reached only through the debug loopback endpoint (D-471);
# 993 has the image's self-signed certificate, which Stow must refuse (D-570 item 4).
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Junk {
    special_use = \Junk
  }
}

log_path = /dev/stdout
